name: Native backend CI

on:
  pull_request:
  push:

jobs:
  native-backend:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      - name: Run native import smoke test
        run: python -c "import pynns._nnscore as c; print(c.lpm(2.0, 0.0, [-2.0, -1.0, 0.5, 3.0]))"

      - name: Run invariant tests without Rscript
        run: python -m pytest -q tests/invariants

      - name: Run parity tests without Rscript
        run: python -m pytest -q tests/parity

      - name: Run ruff
        run: ruff check .

      - name: Run mypy
        run: mypy

      - name: Build distributions
        run: python -m build
